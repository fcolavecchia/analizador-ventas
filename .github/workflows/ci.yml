name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Archivos del docente sin cambios
        if: github.event_name == 'pull_request'
        run: scripts/verificar_intocables.sh origin/${{ github.base_ref }}
      - name: Tests
        run: uv run pytest
